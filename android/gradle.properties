# Keep the Gradle daemon and the separate Kotlin compiler daemon small enough
# to run side by side on a 16 GB machine. At 8 GB each they exhausted memory
# and the build JVM crashed ("insufficient memory for the Java Runtime").
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
# Kotlin's incremental cache fails when the project and the pub cache are on
# different drives (here D: and C:): "this and base files have different roots".
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
